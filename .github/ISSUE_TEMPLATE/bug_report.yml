
name: Bug report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: input
    id: gamename
    attributes:
      label: GAME
      placeholder: e.g. The Apartment
    validations:
      required: true
       
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. Go to...
        3. Do...
        4. See the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How serious is it?
      options:
        - Crash
        - Blocks progress
        - Major gameplay issue
        - Minor visual/audio issue
        - Cosmetic
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Game version or build
      placeholder: e.g. v0.1.2, itch.io build, main branch

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Windows 11, Linux, Steam Deck

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or video
      description: Attach anything that helps reproduce the issue.
